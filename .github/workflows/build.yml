name: build

on:
  push:
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
    inputs:
      client_ref:
        description: Branch of sergiopoverony/cs16-client to take the client from
        default: czds

# czeror: the server is built from here. On Windows the client and the menu
# are built in the same job from sergiopoverony/cs16-client (branch czds) until
# the client is built from the CZ sources, the package holds both.
# Run it by hand (workflow_dispatch) after a change of the client.

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: windows-latest
            cc: cl
            cxx: cl
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install 32-bit toolchain
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-multilib ninja-build

    - name: Build on Linux
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_CLIENT=OFF -B build -S . -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--no-undefined" -DCMAKE_INSTALL_PREFIX="$PWD/dist"
        cmake --build build --target all
        cmake --build build --target install

    - name: Set developer command prompt for Windows x86
      if: startsWith(matrix.os, 'windows')
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build on Windows
      if: startsWith(matrix.os, 'windows')
      run: |
        cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_CLIENT=OFF -B build -S . -DCMAKE_INSTALL_PREFIX="dist"
        cmake --build build --target all
        cmake --build build --target install

    - name: Checkout client
      if: startsWith(matrix.os, 'windows')
      uses: actions/checkout@v4
      with:
        repository: sergiopoverony/cs16-client
        ref: ${{ github.event.inputs.client_ref || 'czds' }}
        path: client-src
        submodules: recursive

    - name: Build client on Windows
      if: startsWith(matrix.os, 'windows')
      shell: bash
      working-directory: client-src
      run: |
        git -C 3rdparty/mainui_cpp apply --ignore-whitespace ../../mainui_background.patch
        gd=$(grep ../build/CMakeCache.txt -Ee 'GAMEDIR:STRING=[a-z0-9]+' | cut -d '=' -f 2)
        cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DBUILD_SERVER=OFF -DENABLE_YY_THUNKS=OFF -DGAME_DIR="$gd" \
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist"
        cmake --build build
        cmake --install build
        echo "client: $(git rev-parse --short HEAD)"

    # while testing the package holds only what changes: no debug files (.pdb)
    # and no extras.pk3 of the client (the game folder already has it)
    - name: Strip the package
      shell: bash
      run: |
        find dist -name '*.pdb' -delete -print
        find dist -name 'extras.pk3' -delete -print
        find dist -type f

    - name: Extract branch name
      shell: bash
      run: echo "branch=$(echo ${GITHUB_REF#refs/heads/} | tr '/' '_')" >> $GITHUB_OUTPUT
      id: extract_branch
    - name: Extract gamedir
      shell: bash
      run: echo "gamedir=$(grep build/CMakeCache.txt -Ee 'GAMEDIR:STRING=[a-z0-9]+' | cut -d '=' -f 2)" >> $GITHUB_OUTPUT
      id: extract_gamedir
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.extract_gamedir.outputs.gamedir }}-${{ startsWith(matrix.os, 'windows') && 'windows' || 'linux' }}
        path: dist/${{ steps.extract_gamedir.outputs.gamedir }}
