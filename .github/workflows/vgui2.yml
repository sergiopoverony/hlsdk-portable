name: vgui2

# Experiment: builds FWGS/freevgui2 (vgui2.dll + the stand-in gameui.dll) for Windows x86.
# Run by hand (workflow_dispatch).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout freevgui2
      uses: actions/checkout@v4
      with:
        repository: FWGS/freevgui2
        path: freevgui2
        submodules: recursive

    - name: Set developer command prompt for Windows x86
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build
      shell: bash
      working-directory: freevgui2
      run: |
        cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=Release -DFREEVGUI2_XASH_SUPPORT=ON
        cmake --build build
        mkdir -p ../out
        find build -name '*.dll' -exec cp -v {} ../out/ \;
        ls -la ../out

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: vgui2-windows-x86
        path: out
